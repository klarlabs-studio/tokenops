# Build tokenops-team from this checkout instead of pulling the published
# image: for a fork, a patch, or a commit between releases.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The image is tagged locally as tokenops-team:${TEAM_VERSION}, so it never
# shadows the published one.
services:
  team:
    build:
      context: ../..
      dockerfile: deploy/team/Dockerfile
      args:
        VERSION: ${TEAM_VERSION:?set TEAM_VERSION in .env}
    image: tokenops-team:${TEAM_VERSION:?set TEAM_VERSION in .env}
    pull_policy: build
