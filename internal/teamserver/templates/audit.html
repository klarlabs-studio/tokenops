{{define "content"}}
<h1>Audit log</h1>
<p class="muted">Newest first: every invite, enrolment, grant, removal and view of an individual's figures.</p>
<div class="scroll">
<table>
  <thead><tr><th>When (UTC)</th><th>Who</th><th>What</th><th>About</th><th>Detail</th></tr></thead>
  <tbody>
  {{range .Data}}
  <tr><td>{{.At.UTC.Format "2006-01-02 15:04"}}</td><td>{{.Actor}}</td><td>{{.Action}}</td><td>{{.Subject}}</td><td>{{.Detail}}</td></tr>
  {{end}}
  </tbody>
</table>
</div>
{{end}}
