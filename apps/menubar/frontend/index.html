<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TokenOps</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="panel">
  <nav id="tabs" class="tabs" role="tablist" aria-label="Plans"></nav>
  <main id="detail" class="detail" aria-live="polite"></main>
  <p id="error" class="error" hidden></p>
  <footer class="menu">
    <label class="row coach-row" for="preset">
      <span class="row-icon" aria-hidden="true">◎</span>
      <span class="row-label">Coach</span>
      <select id="preset">
        <option value="observe">Observe</option>
        <option value="advise">Advise</option>
        <option value="guided">Guided</option>
        <option value="autopilot">Autopilot</option>
      </select>
    </label>
    <button id="close" type="button" class="row">
      <span class="row-icon" aria-hidden="true">✕</span>
      <span class="row-label">Close</span>
      <kbd>esc</kbd>
    </button>
  </footer>
</div>
<script src="panel.js"></script>
</body>
</html>
