<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TokenOps</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>TokenOps</h1>
    <p id="insight" class="insight">…</p>
  </header>
  <section id="plans" aria-label="Plans"></section>
  <p id="error" class="error" hidden></p>
  <section class="coach" aria-label="Coach">
    <label for="preset">Coach</label>
    <select id="preset">
      <option value="observe">observe — records only</option>
      <option value="advise">advise — tells, changes nothing</option>
      <option value="guided">guided — refuses re-reads, asks first</option>
      <option value="autopilot">autopilot — acts on its own</option>
    </select>
  </section>
  <footer>
    <span id="updated" class="muted"></span>
    <button id="close" type="button" class="secondary">Close</button>
  </footer>
</main>
<script src="panel.js"></script>
</body>
</html>
