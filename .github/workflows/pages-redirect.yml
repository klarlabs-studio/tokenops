name: Pages redirect

# The documentation moved to https://team.klarlabs.de/ (0.114.0). GitHub
# Pages keeps serving the last site it deployed, so old links showed the
# old docs. This deploys a page that sends every old address to the same
# page on the new site: 404.html answers every path Pages does not have.

on:
  push:
    branches: [main]
    paths:
      - ".github/pages-redirect/**"
      - ".github/workflows/pages-redirect.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .github/pages-redirect
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
