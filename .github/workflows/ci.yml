name: CI

on:
  # Direct pushes to main (docs, memory, CHANGELOG) stay cheap: skip CI when
  # only ignored paths changed.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  # PRs run CI unconditionally so the branch-protection required checks (Lint,
  # Test, Bench gate) ALWAYS report. A doc/CHANGELOG-only PR that skips CI leaves
  # those checks unreported and the PR sits BLOCKED ("Expected — waiting for
  # status"), forcing an --admin bypass — which is exactly what happened on the
  # v0.41.0 release PR. (pricing.yaml / testdata are not ignored, so catalog
  # edits already get full CI regardless.)
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned actions still default to Node 20, which GitHub removes from
# runners 2026-09-16. Force Node 24 (the default from 2026-06-16) so
# workflows keep running when Node 20 disappears.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.25"
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum out of sync; run 'go mod tidy'"
            exit 1
          fi
      - name: gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt issues:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v7.0.0
        with:
          version: v2.11.4
          args: --timeout=5m
      - name: proto-verify (skip if protoc missing)
        run: make proto-verify

  test:
    name: Test
    # Single-OS matrix so the check reports as "Test (ubuntu-latest)", matching
    # the required status check in branch protection (a bare "Test" name would
    # not satisfy it — the source of the --admin-only merges). Extends cleanly
    # if more OSes are added later.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.25"
          cache: true
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 7

  bench-gate:
    name: Bench gate
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.25"
          cache: true
      # Shared GitHub runners are noisy; loosen the threshold for CI.
      - name: Proxy p99 overhead gate
        env:
          TOKENOPS_BENCH_P99_MS: "200"
        run: go test -run TestProxyP99OverheadGate -count=1 -timeout 120s ./internal/proxy/

  build:
    name: Build
    # Cross-compile smoke test. Runs only on push to main (post-merge) and not
    # on PRs to save Actions minutes — it is ~55% of a run (5 jobs) and the least
    # valuable per-PR: `go test`/`go vet` already compile-check on linux for
    # every PR, and goreleaser does the authoritative cross-compile at release.
    # A platform-specific build break surfaces on the main push (and release),
    # not silently. Build is not a required status check, so skipping it on PRs
    # does not block them.
    if: ${{ github.event_name == 'push' }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.25"
          cache: true
      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for bin in tokenops tokenopsd; do
            ext=""
            if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
            go build -trimpath -ldflags "-s -w" \
              -o "dist/${bin}-${GOOS}-${GOARCH}${ext}" "./cmd/${bin}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  # web/dashboard was built by nothing. pages.yml builds web/docs only, so
  # the dashboard's dependency tree drifted into an unresolvable state —
  # vite 8 against @vitejs/plugin-vue 5, whose peer range stops at vite 6 —
  # and `npm install` failed for anyone who tried, while every PR touching
  # it still reported green because only the Go jobs ran.
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/dashboard/package-lock.json
      # `npm ci` rather than `npm install`: it fails on a lockfile that
      # disagrees with package.json instead of quietly resolving around it,
      # which is the drift this job exists to catch.
      - name: Install
        working-directory: web/dashboard
        run: npm ci
      - name: Typecheck
        working-directory: web/dashboard
        run: npm run typecheck
      - name: Build
        working-directory: web/dashboard
        run: npm run build
