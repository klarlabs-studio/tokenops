name: CI

on:
  # Direct pushes to main (docs, memory, CHANGELOG) stay cheap: skip CI when
  # only ignored paths changed.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  # PRs run CI unconditionally so the branch-protection required checks (Lint,
  # Test, Bench gate) ALWAYS report. A doc/CHANGELOG-only PR that skips CI leaves
  # those checks unreported and the PR sits BLOCKED ("Expected — waiting for
  # status"), forcing an --admin bypass — which is exactly what happened on the
  # v0.41.0 release PR. (pricing.yaml / testdata are not ignored, so catalog
  # edits already get full CI regardless.)
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned actions still default to Node 20, which GitHub removes from
# runners 2026-09-16. Force Node 24 (the default from 2026-06-16) so
# workflows keep running when Node 20 disappears.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.26"
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum out of sync; run 'go mod tidy'"
            exit 1
          fi
      - name: gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt issues:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      # skip-cache: a restored golangci-lint cache makes staticcheck report
      # SA5011 after t.Fatal on unchanged test files (2026-10-07: a cold run
      # of the same commit passed, every warm run failed, and a cache saved
      # by a passing run failed the next one). Lint cold until that is
      # fixed upstream; it costs about a minute.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v7.0.0
        with:
          version: v2.14.0
          args: --timeout=5m
          skip-cache: true
      - name: proto-verify (skip if protoc missing)
        run: make proto-verify

  test:
    name: Test
    # Single-OS matrix so the check reports as "Test (ubuntu-latest)", matching
    # the required status check in branch protection (a bare "Test" name would
    # not satisfy it — the source of the --admin-only merges). Extends cleanly
    # if more OSes are added later.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.26"
          cache: true
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 7

  menubar:
    name: Menu bar
    # apps/menubar is its own module (Vitra needs cgo and a newer Go than
    # the CLI's pure-Go 1.26 build), so the root ./... never reaches it.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/menubar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version-file: apps/menubar/go.mod
          cache-dependency-path: apps/menubar/go.sum
      - name: go vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Build the native app
        run: CGO_ENABLED=1 go build -tags vitra_native -o tokenops-menubar .
      # The release builds TokenOps.app the same way; a packaging break
      # shows up here rather than on a tag.
      - name: Package TokenOps.app
        working-directory: .
        # A relative output path, as the release passes it.
        run: scripts/build-menubar-app.sh v0.0.0-ci menubar-dist && test -d menubar-dist/TokenOps.app
      # Handed to "Release dry run", as release.yml hands it to goreleaser.
      - name: Pack
        working-directory: .
        run: tar -czf menubar-app.tar.gz -C menubar-dist TokenOps.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: menubar-app
          path: menubar-app.tar.gz
          retention-days: 1

  release-dry-run:
    name: Release dry run
    # A release publishes nothing unless the menu bar build and goreleaser
    # both succeed, so neither may build for the first time on a tag. This
    # runs goreleaser exactly as release.yml does, as a snapshot that
    # publishes nothing.
    needs: [menubar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: menubar-app
      - name: Unpack the menu bar app
        run: mkdir -p menubar-dist && tar -xzf menubar-app.tar.gz -C menubar-dist && rm menubar-app.tar.gz
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "v2.18.2"
          args: release --snapshot --clean
        env:
          # A snapshot never pushes the cask; the template only needs a value.
          HOMEBREW_TAP_TOKEN: snapshot
      # release.yml's npm job unpacks every tokenops_<version>_*.tar.gz it
      # finds in the release and verifies them against checksums.txt:
      # exactly the four CLI archives.
      - name: The npm job still selects only the CLI archives
        run: |
          set -euo pipefail
          version=$(jq -r .version dist/metadata.json)
          cd dist
          grep -F "  tokenops_${version}_" checksums.txt | grep -E '\.tar\.gz$' > archives.sha256
          sha256sum --check --strict archives.sha256
          printf '%s\n' tokenops_"${version}"_*.tar.gz | tee npm-archives.txt
          test "$(wc -l < npm-archives.txt)" -eq 4
          test "$(wc -l < archives.sha256)" -eq 4

  bench-gate:
    name: Bench gate
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.26"
          cache: true
      # Shared GitHub runners are noisy; loosen the threshold for CI.
      - name: Proxy p99 overhead gate
        env:
          TOKENOPS_BENCH_P99_MS: "200"
        run: go test -run TestProxyP99OverheadGate -count=1 -timeout 120s ./internal/proxy/

  build:
    name: Build
    # Cross-compile smoke test. Runs only on push to main (post-merge) and not
    # on PRs to save Actions minutes — it is ~55% of a run (5 jobs) and the least
    # valuable per-PR: `go test`/`go vet` already compile-check on linux for
    # every PR, and goreleaser does the authoritative cross-compile at release.
    # A platform-specific build break surfaces on the main push (and release),
    # not silently. Build is not a required status check, so skipping it on PRs
    # does not block them.
    if: ${{ github.event_name == 'push' }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.26"
          cache: true
      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for bin in tokenops tokenopsd; do
            ext=""
            if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
            go build -trimpath -ldflags "-s -w" \
              -o "dist/${bin}-${GOOS}-${GOARCH}${ext}" "./cmd/${bin}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7
