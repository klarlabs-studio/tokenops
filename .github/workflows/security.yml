name: Security

# Replaces Dependabot. nox runs on every push + PR + weekly so
# vulnerability discovery happens on a tight loop. The job fails the
# build only on unwaived critical findings. Every unwaived finding, of
# any severity, is uploaded as SARIF to code scanning (the Security tab,
# and inline on pull requests); findings.json is also kept as a 7-day
# artifact for the suppression review.
#
# Waivers live in security/vex.json (OpenVEX), one statement per
# finding, bound by fingerprint. See security/SUPPRESSION-GOVERNANCE.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Mon 06:00 UTC. Daily cron retired — burns Actions minutes; PRs+pushes already trigger scans.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Pinned actions still default to Node 20, which GitHub removes from
# runners 2026-09-16. Force Node 24 (the default from 2026-06-16) so
# workflows keep running when Node 20 disappears.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  nox-scan:
    name: nox scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Install nox
        env:
          # Pinned. Bump deliberately after reviewing the release notes
          # at https://github.com/nox-hq/nox/releases, and update the
          # checksum in the same commit — a version bump without one
          # silently reverts this step to trusting the network.
          NOX_VERSION: "1.48.1"
          # sha256 of nox_<version>_linux_amd64.tar.gz, from the release's
          # checksums.txt. The org's central workflows verify this; this
          # step used to pipe curl straight into tar, so a compromised or
          # substituted release would have been unpacked and run against
          # the whole repository without a word.
          NOX_SHA256: "65a725c14bbd4ef533ffcc430ace3f52362e7a657f4d4ccc3a1f63d8c7343313"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tarball="$(mktemp -d)/nox.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/nox-hq/nox/releases/download/v${NOX_VERSION}/nox_${NOX_VERSION}_linux_amd64.tar.gz"
          echo "${NOX_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nox" version

      - name: Scan
        # nox exits non-zero whenever findings exist; we always treat
        # the scan itself as informational and let the gate step decide
        # whether to fail the build.
        # --format json,sarif writes findings.json and results.sarif.
        # No --vex here: nox 1.48.1 matches VEX statements by rule ID,
        # not fingerprint, so waivers are applied by the steps below.
        run: nox scan . --format json,sarif || true

      - name: Suppression review
        # Advisory, never blocking: reports suppressions past the review
        # cadence and waivers whose fingerprint matches nothing in this
        # scan. The blocking half lives in internal/secgov, which checks
        # that every suppression is documented and points at a tracked
        # path. See security/SUPPRESSION-GOVERNANCE.md.
        run: python3 scripts/suppression-review-due.py

      - name: Critical gate
        # scripts/sec-gate.py reads findings.json + security/vex.json
        # (the latter optional: absent means no waivers)
        # and exits non-zero only when at least one critical finding
        # is not waived in OpenVEX.
        run: python3 scripts/sec-gate.py

      - name: Test the security scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Apply waivers to SARIF
        # Drops results whose fingerprint security/vex.json waives, so a
        # waiver covers exactly its finding and a new finding of the same
        # rule still opens an alert. Reporting must never gate the build.
        if: always()
        continue-on-error: true
        run: python3 scripts/sarif-apply-vex.py results.sarif security/vex.json nox.sarif

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('nox.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: nox.sarif
          category: nox

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nox-findings
          path: findings.json
          retention-days: 7

      - name: Summarise
        if: always()
        run: |
          if [ -f findings.json ]; then
            python3 <<'PY'
          import json
          from collections import Counter
          d = json.load(open("findings.json"))
          findings = d.get("findings", []) if isinstance(d, dict) else d
          by_sev = Counter(f["Severity"] for f in findings)
          by_rule = Counter(f["RuleID"] for f in findings)
          print(f"Total: {len(findings)}")
          print("By severity:", dict(by_sev))
          print("Top rules:")
          for rule, n in by_rule.most_common(10):
              print(f"  {rule}: {n}")
          PY
          fi
