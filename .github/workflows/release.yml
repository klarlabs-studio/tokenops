name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      # checkout@v4 / setup-go@v5 / goreleaser-action@v6 still default
      # to Node 20, which GitHub removes from runners 2026-09-16. Force
      # Node 24 now (default from 2026-06-16 anyway) so the workflow
      # doesn't break when the runner drops Node 20.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v7 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7.0.0 # v5.4.0
        with:
          go-version: "1.25"
          cache: true

      - uses: goreleaser/goreleaser-action@v7 # v6.3.0
        with:
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org secret with contents:write on klarlabs-studio/homebrew-tap.
          # goreleaser's homebrew_casks: section consumes this to push
          # the updated Casks/tokenops.rb on every release. It must be
          # the org's own tap: an org secret does not reach a personal
          # repo and answers 403 there. See .goreleaser.yaml.
          # ONE name across the org: HOMEBREW_TAP_TOKEN. This repo used to read
          # kl_HOMEBREW_TAP_TOKEN, which meant the same credential lived under
          # two names — the condition release.yml in warden warns about, and
          # the one that shipped v0.19.0 with a 401 and 0.20.0 with a 403:
          # rotating one name leaves the other stale, and an undefined secret
          # expands to an EMPTY STRING rather than failing, so the symptom is a
          # confusing 401 from the forge instead of "this secret is missing".
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
