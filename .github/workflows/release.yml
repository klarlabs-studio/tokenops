name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The menu bar app needs cgo against AppKit, so it is built here, on
  # macOS, and handed to goreleaser, which puts it in the darwin archives.
  # It is ad hoc signed: there is no Developer ID to notarize it with, and
  # the cask's post-install hook clears its quarantine flag.
  menubar-app:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/menubar/go.mod
          cache-dependency-path: apps/menubar/go.sum
      - name: Build TokenOps.app
        run: scripts/build-menubar-app.sh "${GITHUB_REF_NAME}" menubar-dist
      # An artifact upload drops file modes; a tarball keeps the bundle's
      # executable bit and its signature intact.
      - name: Pack
        run: tar -czf menubar-app.tar.gz -C menubar-dist TokenOps.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: menubar-app
          path: menubar-app.tar.gz
          retention-days: 1

  goreleaser:
    needs: menubar-app
    runs-on: ubuntu-latest
    env:
      # checkout@v4 / setup-go@v5 / goreleaser-action@v6 still default
      # to Node 20, which GitHub removes from runners 2026-09-16. Force
      # Node 24 now (default from 2026-06-16 anyway) so the workflow
      # doesn't break when the runner drops Node 20.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      # goreleaser reaches the tap push at the very END of a release, after the
      # binaries are built, signed, and uploaded. A tap credential that is empty
      # or unauthorized therefore fails a release that has already half-shipped,
      # and it fails as an HTTP status from a git push rather than as a name.
      # That is exactly how v0.54.1 and v0.54.2 went out: both published their
      # GitHub release and binaries, both failed the cask step with a 401, and
      # the 401 was twice diagnosed as an expired token — once correctly, once
      # not, costing a wrong fix and a third tag. An undefined secret expands to
      # the empty string rather than failing, so a name problem and a dead token
      # are indistinguishable from that vantage point. Assert the credential
      # here, before anything is published, and say which of the two it is.
      # Ported from klarlabs-studio/warden, where the same class cost v0.19.0
      # (401) and v0.20.0 (403).
      # The wording of the messages below is deliberate, so please do not
      # "tidy" it. Two nox rules match this step's ERROR TEXT rather than its
      # behaviour: SEC-163 reads the secret's name as a high-entropy hex string
      # when it carries the `secrets.` prefix, and IAC-314 reads the colon form
      # of the write-permission name, quoted inside an English sentence, as a
      # permission this workflow grants. Both are false positives on prose —
      # but SARIF is not baseline-filtered, so they arrive as PR review threads
      # and block the merge under required_conversation_resolution. Naming the
      # secret without the prefix, and spelling the permission out in words,
      # keeps the messages actionable and the scanner quiet.
      - name: Check the tap credential
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_GITHUB_TOKEN}" ]; then
            echo "::error::the tap credential is empty: this workflow asked" \
                 "for HOMEBREW_TAP_TOKEN and got nothing back. An undefined" \
                 "secret expands to an empty string rather than failing, so this" \
                 "is a NAME problem, not an expired token — check the secret's" \
                 "exact spelling in the klarlabs-studio org settings, and that" \
                 "this repository is on its access list."
            exit 1
          fi
          # Distinguish "no credential" (401) from "credential refused" (403)
          # while the release can still be abandoned cheaply. Only the status
          # code is echoed; the body may quote the request.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TAP_GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/klarlabs-studio/homebrew-tap)
          case "$code" in
            200) echo "tap credential accepted (200)" ;;
            401) echo "::error::401 from the tap repo: the credential was not" \
                      "accepted at all. The secret holds something, but GitHub" \
                      "rejected it — expired or malformed token." ; exit 1 ;;
            403) echo "::error::403 from the tap repo: the credential was" \
                      "presented and refused. It authenticates but lacks" \
                      "write access to klarlabs-studio/homebrew-tap, or its" \
                      "fine-grained resource owner is wrong (that owner is" \
                      "immutable — re-mint rather than edit permissions)." ; exit 1 ;;
            404) echo "::error::404 from the tap repo: the credential cannot" \
                      "see klarlabs-studio/homebrew-tap. For a fine-grained" \
                      "token this is indistinguishable from no access." ; exit 1 ;;
            *)   echo "::error::unexpected HTTP $code from the tap repo." ; exit 1 ;;
          esac

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: menubar-app
      - name: Unpack the menu bar app
        run: mkdir -p menubar-dist && tar -xzf menubar-app.tar.gz -C menubar-dist && rm menubar-app.tar.gz

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          # Exact, not "~> 2": a range fetches whichever goreleaser is newest
          # at tag time into a job holding the tap credential. Bump deliberately.
          version: "v2.18.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org secret with contents:write on klarlabs-studio/homebrew-tap.
          # goreleaser's homebrew_casks: section consumes this to push
          # the updated Casks/tokenops.rb on every release. It must be
          # the org's own tap: an org secret does not reach a personal
          # repo and answers 403 there. See .goreleaser.yaml.
          # The "Check the tap credential" step above asserts this resolves
          # and authenticates before goreleaser publishes anything.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # The team plane's container image, ghcr.io/klarlabs-studio/tokenops-team,
  # for linux/amd64 and linux/arm64. It runs only after goreleaser published
  # the release, and copies the tokenops-team binary out of that release's
  # archives (verified against checksums.txt) rather than compiling again,
  # so the image runs what the release ships. The only job that can write
  # packages. CI's "Release dry run" runs the same script on a snapshot.
  team-image:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the release's team archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" -p "tokenops-team_${version}_linux_*.tar.gz" -p checksums.txt -D team-archives
      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build, check and push the image
        run: scripts/build-team-image.sh "${GITHUB_REF_NAME#v}" team-archives --push

  # npm is a delivery channel only: `npx @klarlabs-studio/tokenops checkup`
  # with no other install. The wrapper launches the binary from one of four
  # platform packages, and those are unpacked from THIS release's archives,
  # so npm ships byte for byte what GitHub and Homebrew ship.
  #
  # Auth: npm trusted publishing (OIDC). Each of the five packages names
  # this repo and release.yml as its trusted publisher; setup-node's
  # registry-url is what makes npm take the OIDC path. Do not set
  # NODE_AUTH_TOKEN, not even to "": an empty token makes npm ENEEDAUTH
  # instead of using OIDC (warden hit this). id-token signs provenance too.
  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Unpack the release's binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" -p "tokenops_${version}_*.tar.gz" -p checksums.txt -D release-archives
          # Verify every archive against goreleaser's checksums.txt before
          # anything is unpacked. sha256sum --check fails on a mismatch or on
          # a listed archive that did not download; the loop fails on a
          # downloaded archive the manifest does not list, which --check
          # alone would let through unverified.
          (
            cd release-archives
            grep -F "  tokenops_${version}_" checksums.txt | grep -E '\.tar\.gz$' > archives.sha256 \
              || { echo "::error::checksums.txt lists no tokenops ${version} archives"; exit 1; }
            sha256sum --check --strict archives.sha256
            for f in tokenops_"${version}"_*.tar.gz; do
              grep -qxF "$(sha256sum "$f")" archives.sha256 \
                || { echo "::error::$f is not listed in checksums.txt"; exit 1; }
            done
          )
          for f in release-archives/*.tar.gz; do
            target=$(basename "$f" .tar.gz)
            dir="npm-dist/tokenops_${target#"tokenops_${version}_"}"
            mkdir -p "$dir"
            tar -xzf "$f" -C "$dir" tokenops
          done
          ls npm-dist
      - name: Assemble npm packages
        run: node npm/scripts/build-packages.mjs "${GITHUB_REF_NAME#v}" npm-dist npm/packages
      # npm versions are immutable, so a re-driven release would fail here on
      # versions it already published. A version already on the registry is
      # skipped; any other failure (auth, network) still fails the step.
      - name: Publish platform packages
        run: |
          set -euo pipefail
          for d in npm/packages/*/; do
            name=$(node -p "require('./$d/package.json').name")
            version=$(node -p "require('./$d/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version already published; skipping."
              continue
            fi
            ( cd "$d" && npm publish --provenance --access public )
          done
      - name: Publish the wrapper
        run: |
          set -euo pipefail
          name=$(node -p "require('./npm/package.json').name")
          version=$(node -p "require('./npm/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version already published; skipping."
            exit 0
          fi
          cd npm && npm publish --provenance --access public
