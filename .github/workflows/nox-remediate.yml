name: Nox remediate

# THE dependency-update path for this repo: .github/dependabot.yml and
# dependabot-auto-merge.yml were removed in favour of it, matching the
# fleet model (warden local gate + nox CI scan + nox-remediate).
#
# Know what this does NOT cover, so the gap is a choice rather than a
# surprise. It remediates Go module findings that carry a `fixed_in`
# advisory — security fixes, not version currency. Two things Dependabot
# used to do now do not happen on their own:
#   - web/dashboard's npm tree (verify-cmd below is Go-only, and
#     package-lock.json is excluded in .nox.yaml)
#   - routine minor/patch bumps with no advisory attached
# Both are deliberate: routine currency churn is what made Dependabot
# expensive here, and majors needed a human every time regardless
# (TypeScript 7 and vue-router 5 both did). Run `nox scan` or bump by
# hand when currency actually matters.
#
# Replaces Dependabot's "open a PR with the version bump" loop. Wraps
# nox-hq/nox-remediate-action: scans, runs `nox fix`, optionally
# verifies the test suite, and opens (or refreshes) a PR with the
# resulting upgrades.
#
# Only VULN-001 findings carrying a `fixed_in` advisory are eligible.
# Major-version bumps are off by default; flip include_major via the
# workflow_dispatch input when you want to pull them in too.
on:
  schedule:
    # Weekly Mon 04:00 UTC — earlier than the security scan (06:00).
    # Daily cron retired; workflow_dispatch available for ad-hoc runs.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      include_major:
        description: "Apply major-version bumps too (off by default; review manually)."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nox-remediate
  cancel-in-progress: true

# Pinned actions still default to Node 20, which GitHub removes from
# runners 2026-09-16. Force Node 24 (the default from 2026-06-16) so
# workflows keep running when Node 20 disappears.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  remediate:
    name: Apply OSV upgrades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          # Need full history for the diff inspection + signed-off-by.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.4.0
        with:
          go-version: "1.25"
          cache: true

      - name: Run nox-remediate
        # The composite action installs nox, runs the scan, builds
        # the upgrade plan, applies it, runs the verify command,
        # and opens / refreshes a PR. Pinned to v1.0.1's commit SHA;
        # bump deliberately after reviewing the release notes.
        uses: nox-hq/nox-remediate-action@bd80743be12912cec91111b9d0a988b7845788f0 # v1.0.2
        with:
          path: .
          version: "0.9.5"
          include-major: ${{ inputs.include_major || 'false' }}
          # `nox fix` only touches the Go module by default. Run our
          # full make verify after the upgrade so we catch breaks
          # introduced by transitive bumps too. The action also
          # tidies go.mod for us.
          verify-cmd: "go test -count=1 ./... -timeout 240s"
          pr-branch-prefix: "nox/remediate"
          pr-title: "chore(deps): nox remediate"
          pr-labels: "dependencies,security,nox-remediation"
          pr-base: main
