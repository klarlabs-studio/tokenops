# Dependency and action-pin remediation, delegated to the org's central
# workflow. This file used to carry its own copy — its own nox pin, its
# own steps — and that is exactly why it rotted: the fleet default moved
# to 1.30.0 while this repo sat on 0.9.5, a version that never populates
# `fixed_in`, which `nox fix` gates on. So remediation here could not act
# on anything for months, silently, while nine sibling repos were fine.
#
# The central workflow is also strictly more capable than the copy it
# replaces. It sets up Node as well as Go (so npm is remediated, not just
# the Go module), verifies the nox tarball's sha256 rather than trusting
# a bare curl, and remediates outdated GitHub Actions pins alongside
# dependencies.
#
# One behaviour is lost: the old copy ran `go test ./...` after applying
# upgrades and abandoned the run if they failed. The central workflow
# opens the PR regardless. That is the better failure mode — a red PR is
# visible and actionable, a silently abandoned remediation is not — and
# this repo's required checks run on that PR anyway.
#
# To change the nox version, bump it centrally in
# klarlabs-studio/.github; every caller picks it up. Do not re-pin here.
name: Nox Remediate

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  remediate:
    uses: klarlabs-studio/.github/.github/workflows/nox-remediate.yml@main
    secrets: inherit
    # with:
    #   include-major: true   # also apply major-version action bumps
