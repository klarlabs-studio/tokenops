version: 2
project_name: tokenops

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  # Each binary is built twice, Linux and macOS apart, so that only the
  # macOS archives carry the menu bar app and the presence helper
  # (scripts/build-menubar-app.sh, built on a macOS runner before this runs).
  - &tokenops
    id: tokenops-linux
    binary: tokenops
    main: ./cmd/tokenops
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X go.klarlabs.de/tokenops/internal/version.Version={{ .Version }}
      - -X go.klarlabs.de/tokenops/internal/version.Commit={{ .Commit }}
      - -X go.klarlabs.de/tokenops/internal/version.Date={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - <<: *tokenops
    id: tokenops-darwin
    goos:
      - darwin

  - &tokenopsd
    id: tokenopsd-linux
    binary: tokenopsd
    main: ./cmd/tokenopsd
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X go.klarlabs.de/tokenops/internal/version.Version={{ .Version }}
      - -X go.klarlabs.de/tokenops/internal/version.Commit={{ .Commit }}
      - -X go.klarlabs.de/tokenops/internal/version.Date={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - <<: *tokenopsd
    id: tokenopsd-darwin
    goos:
      - darwin

# The darwin binaries are signed with the Developer ID and notarized here,
# on Linux, with quill (hardened runtime, Apple's timestamp). A bare binary
# cannot carry a stapled ticket: Gatekeeper looks the notarization up online
# the first time it runs. TokenOps.app and tokenops-presence are signed and
# notarized on the macOS runner instead (scripts/macos-notarize.sh), since
# quill does not sign app bundles.
#
# It runs only when the signing secrets reach the job (release.yml); the
# CI dry run has none, so it builds ad hoc signed binaries as before.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [tokenops-darwin, tokenopsd-darwin]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: linux
    ids: [tokenops-linux, tokenopsd-linux]
    formats: ["tar.gz"]
    files:
      - LICENSE
      - README.md
  # The menu bar app is signed with the Developer ID and notarized on the
  # macOS runner (release.yml); `tokenops menubar` installs it to
  # ~/Applications. tokenops-presence is the presence helper (ADR 0015),
  # built with the app on the macOS runner (scripts/build-presence-helper.sh),
  # signed the same way, and also inside TokenOps.app. tokenops finds it beside itself (through
  # the cask's bin/ link), so the cask needs no binaries entry for it.
  - id: darwin
    ids: [tokenops-darwin, tokenopsd-darwin]
    formats: ["tar.gz"]
    files:
      - LICENSE
      - README.md
      - src: menubar-dist/TokenOps.app
        dst: TokenOps.app
      - src: menubar-dist/tokenops-presence
        dst: tokenops-presence
        info:
          mode: 0755

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - merge

release:
  github:
    owner: klarlabs-studio
    name: tokenops
  draft: false

# Automatically bump the klarlabs-studio/homebrew-tap cask on every
# tag push. Replaces the brittle sed-based update job in
# .github/workflows/release.yml that silently no-op'd when the formula
# schema drifted from the placeholder patterns it expected.
#
# Requires HOMEBREW_TAP_TOKEN — the klarlabs-studio org secret of the same
# name (confirmed present, 93 chars) — exposed to
# the goreleaser step. It needs `contents:write` on the tap, and the tap is the
# one owned by the org that owns this repo: an org secret does not reach a
# personal repo, which answers 403 (briefkasten's v0.31.0 published every
# artifact and then failed exactly there).
# homebrew_casks replaces brews (deprecated in GoReleaser v2.16). Homebrew's
# own guidance is that a cask, not a formula, is the right vehicle for a
# pre-compiled binary -- the formula path generated something that only
# pretended to build from source.
homebrew_casks:
  - name: tokenops
    repository:
      owner: klarlabs-studio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://team.klarlabs.de/"
    description: "Guardrails for coding agents: what is left on every AI plan, and limits your agents respect"
    license: "Apache-2.0"
    commit_author:
      name: github-actions
      email: github-actions@github.com
    commit_msg_template: "tokenops {{ .Tag }}"
    binaries:
      - tokenops
      - tokenopsd
    caveats: |
      First install: supervise the ingestion daemon so it survives reboot:

        tokenops daemon install

      Upgrades restart an installed daemon on the new version by themselves.

      `tokenops serve` is the MCP server and does not ingest.
      `tokenops start` runs the pollers; the unit above keeps it alive.

      On macOS, `tokenops menubar` puts TokenOps in the menu bar.

      A new release that changes the daemon's unit says so in its changelog;
      after that upgrade, run `tokenops daemon install` once.
    hooks:
      # Clear the quarantine flag BEFORE Homebrew links the binaries into
      # bin/, not after. Homebrew installs a cask in a fixed order: extract to
      # the Caskroom, preflight steps, the binary links, postflight steps
      # (Library/Homebrew/cask/artifact/abstract_artifact.rb, sort_order).
      # As a postflight step this left the new binaries quarantined and
      # already on PATH, and tokenops is run constantly from outside: the
      # status line every second, every Claude Code and Codex hook, launchd's
      # KeepAlive daemon. The first of those to run the new binary inside the
      # window got Gatekeeper's first-launch check. A quarantined binary that
      # check does not allow -- an ad hoc one always; a notarized one when the
      # online notarization lookup fails, and a bare binary cannot carry a
      # stapled ticket to fall back on -- gets a "Not Opened" prompt, and the
      # kernel parks every exec of that path until the prompt is answered
      # (syspolicyd: "Prompt shown (5, 0), waiting for response"). Nothing
      # headless answers it, so after v0.118.1 and v0.118.3 the status line,
      # every hook and the daemon hung at launch until syspolicyd was
      # restarted. Cleared before the links exist, no quarantined tokenops is
      # ever reachable, and Gatekeeper never prompts for it.
      #
      # Homebrew runs install steps sandboxed, with a fake HOME and no
      # localhost, so nothing in them can reach the real ~/Library, launchd
      # or the running daemon. The raw-Ruby hook this replaces did, and
      # Homebrew deprecated it. What it did, and where that now happens:
      #
      # - restart the daemon onto the new binary: the daemon checks its own
      #   binary every 30 seconds; when supervised it exits, and launchd or
      #   systemd starts the installed one (internal/daemon/binary_drift.go).
      # - refresh ~/Applications/TokenOps.app: the daemon does it at start,
      #   and copies the app without its quarantine flag
      #   (internal/daemon/menubar_refresh.go, internal/infra/menubarapp).
      # - re-apply the launchd or systemd unit: not done any more. The unit
      #   embeds the binary path (the stable bin/tokenops link), so it only
      #   changes in a release that changes the unit template. Such a release
      #   says so, and the caveats above tell the operator to run
      #   `tokenops daemon install`.
      pre:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}"]
          end
