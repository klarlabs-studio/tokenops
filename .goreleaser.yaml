version: 2
project_name: tokenops

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: tokenops
    binary: tokenops
    main: ./cmd/tokenops
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X go.klarlabs.de/tokenops/internal/version.Version={{ .Version }}
      - -X go.klarlabs.de/tokenops/internal/version.Commit={{ .Commit }}
      - -X go.klarlabs.de/tokenops/internal/version.Date={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: tokenopsd
    binary: tokenopsd
    main: ./cmd/tokenopsd
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X go.klarlabs.de/tokenops/internal/version.Version={{ .Version }}
      - -X go.klarlabs.de/tokenops/internal/version.Commit={{ .Commit }}
      - -X go.klarlabs.de/tokenops/internal/version.Date={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: ["tar.gz"]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - merge

release:
  github:
    owner: klarlabs-studio
    name: tokenops
  draft: false

# Automatically bump the klarlabs-studio/homebrew-tap cask on every
# tag push. Replaces the brittle sed-based update job in
# .github/workflows/release.yml that silently no-op'd when the formula
# schema drifted from the placeholder patterns it expected.
#
# Requires HOMEBREW_TAP_TOKEN — the klarlabs-studio org secret of the same
# name (confirmed present, 93 chars) — exposed to
# the goreleaser step. It needs `contents:write` on the tap, and the tap is the
# one owned by the org that owns this repo: an org secret does not reach a
# personal repo, which answers 403 (briefkasten's v0.31.0 published every
# artifact and then failed exactly there).
# homebrew_casks replaces brews (deprecated in GoReleaser v2.16). Homebrew's
# own guidance is that a cask, not a formula, is the right vehicle for a
# pre-compiled binary -- the formula path generated something that only
# pretended to build from source.
homebrew_casks:
  - name: tokenops
    repository:
      owner: klarlabs-studio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/klarlabs-studio/tokenops"
    description: "Open-source operational intelligence layer for AI systems"
    license: "Apache-2.0"
    commit_author:
      name: github-actions
      email: github-actions@github.com
    commit_msg_template: "tokenops {{ .Tag }}"
    binaries:
      - tokenops
      - tokenopsd
    caveats: |
      First install: supervise the ingestion daemon so it survives reboot:

        tokenops daemon install

      Upgrades restart an installed daemon on the new version by themselves.

      `tokenops serve` is the MCP server and does not ingest.
      `tokenops start` runs the pollers; the unit above keeps it alive.
    hooks:
      post:
        # The release archives are not notarized, so Gatekeeper quarantines both
        # binaries on first run. A formula was never subject to this; a cask is,
        # so without this neither tokenops nor tokenopsd will start.
        #
        # An upgrade replaces the binary under a daemon that keeps running the
        # old one until restarted. Where the unit is installed, re-apply it:
        # `daemon install` restarts an unchanged unit in place, or reloads a
        # changed one. Operators used to be told to run it themselves, and on
        # a running daemon it could stop the old one and fail to start the
        # new. must_succeed: false — a daemon that will not come up is
        # reported, but never fails the upgrade itself.
        install: |
          if OS.mac?
            system_command "xattr", args: ["-dr", "com.apple.quarantine", staged_path]
          end
          unit = if OS.mac?
            File.expand_path("~/Library/LaunchAgents/de.klarlabs.tokenops.plist")
          else
            File.expand_path("~/.config/systemd/user/tokenops.service")
          end
          if File.exist?(unit)
            bin = "#{HOMEBREW_PREFIX}/bin/tokenops"
            system_command bin, args: ["daemon", "install", "--bin", bin], print_stdout: true, print_stderr: true, must_succeed: false
          end
